# Gate replica (Task 5b fix rounds 4 and 5, Task 5c), report-only: the Windows gate as ci.yml runs it (3 bench processes with --calibrate
# time, each from its own copy of the build, gated on the median ratio per operation, and the regression gate on each side's best process
# in alternating processes, tools/check_bench.py) on 8 runners at once, with a second build of the same commit standing in for main (an
# A/A' run of the regression gate, whose head/main values are the samples of tools/bench_regression_limits.json). With pads=true (Task 5c
# fix round 2) head and main are built with different no-op relink pads (ZODIAC_BENCH_PAD, ZODIAC_BENCH_CORE_PAD; job n takes pair n of
# PADS for head and pair n+1 for main), so the samples hold the layout shift a code change elsewhere causes too. slowdown=OP:PERCENT makes
# head's OP that much slower (bench_types --slowdown), to show the gate catches a real slowdown. With main=<ref> (Task 13) that commit's
# build stands in for main instead of a second build of this one, run as ci.yml runs main's bench (--detail only, since an older bench
# may know no other option), so the jobs are paired runs of this commit against it. Trigger:
#   gh workflow run gate-replica.yml --ref <branch> [-f pads=true] [-f slowdown=string_find_ascii:10] [-f main=c380dd9]
name: gate-replica

on:
  workflow_dispatch:
    inputs:
      pads:
        description: "true: head and main built with different relink pads"
        default: "false"
      slowdown:
        description: "OP:PERCENT, head's OP made that much slower (empty: none)"
        default: ""
      main:
        description: "A ref or sha whose build stands in for main (empty: a second build of this commit, an A/A' run)"
        default: ""

permissions:
  contents: read

env:
  PADDED: ${{ inputs.pads || 'false' }}
  SLOWDOWN: ${{ inputs.slowdown || '' }}
  MAIN_REF: ${{ inputs.main || '' }}
  # bench pad_core pad (bytes), as bench-reference.yml's: the bench pad moves everything after it, the core pad the code behind byte_at.
  PADS: "0_0 16_0 0_16 48_32 80_8 112_48 32_64 96_24 0_0"

jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        job: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache toolchain
        uses: actions/cache@v4
        with:
          path: .tools
          key: tools-windows-${{ hashFiles('tools/toolchain.json') }}
      - name: Cache dependency downloads
        uses: actions/cache@v4
        with:
          path: .deps
          key: deps-${{ runner.os }}-release-${{ github.event.repository.name }}-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/ZodiacApplyPatch.cmake', 'cmake/patches/**') }}
      - name: Cache Unicode data
        uses: actions/cache@v4
        with:
          path: .tools/unicode
          key: ucd-16.0.0-${{ hashFiles('tools/gen_unicode.py') }}
      - name: Bootstrap
        run: python bootstrap.py
      - name: Choose the pads
        env:
          JOB: ${{ matrix.job }}
        run: |
          read -r -a pads <<< "$PADS"
          head=0_0
          main=0_0
          if [ "$PADDED" = true ]; then head=${pads[$((JOB-1))]}; main=${pads[$JOB]}; fi
          echo "HEAD_BENCH_PAD=${head%_*}" >> "$GITHUB_ENV"
          echo "HEAD_CORE_PAD=${head#*_}" >> "$GITHUB_ENV"
          echo "MAIN_BENCH_PAD=${main%_*}" >> "$GITHUB_ENV"
          echo "MAIN_CORE_PAD=${main#*_}" >> "$GITHUB_ENV"
          echo "head pads $head, main pads $main"
      - name: Build the benchmark on the release preset
        run: |
          .tools/cmake/bin/cmake --preset windows-release "-DZODIAC_BENCH_PAD=$HEAD_BENCH_PAD" "-DZODIAC_BENCH_CORE_PAD=$HEAD_CORE_PAD"
          .tools/cmake/bin/cmake --build --preset windows-release --target bench_types
      # A second build of the same commit in a worktree stands in for main: the regression gate then compares two builds of the same
      # sources (A/A'), so any failure of it is a false one, and its per-op head/main values are A/A' samples for the limits file.
      - name: Build the same commit again
        shell: pwsh
        run: |
          $ref = 'HEAD'
          if ($env:MAIN_REF) {
          git fetch origin $env:MAIN_REF
          $ref = $env:MAIN_REF
          }
          git worktree add again-src $ref
          if ($LASTEXITCODE -ne 0) { throw "git worktree failed" }
          New-Item -ItemType Junction -Path again-src/.tools -Target (Resolve-Path .tools) | Out-Null
          $deps = "$PWD/.deps/windows-release"
          Push-Location again-src
          ../.tools/cmake/bin/cmake --preset windows-release -B ../build/again "-DFETCHCONTENT_BASE_DIR=$PWD/../build/again/_deps" "-DFETCHCONTENT_SOURCE_DIR_ANGELSCRIPT_SDK=$deps/angelscript_sdk-src" "-DFETCHCONTENT_SOURCE_DIR_DOCTEST=$deps/doctest-src" "-DFETCHCONTENT_SOURCE_DIR_TOMLPLUSPLUS=$deps/tomlplusplus-src" "-DZODIAC_BENCH_PAD=$env:MAIN_BENCH_PAD" "-DZODIAC_BENCH_CORE_PAD=$env:MAIN_CORE_PAD"
          if ($LASTEXITCODE -ne 0) { throw "configure failed" }
          Pop-Location
          .tools/cmake/bin/cmake --build build/again --target bench_types
          if ($LASTEXITCODE -ne 0) { throw "build failed" }
      - name: Gate replica
        run: |
          bench=build/windows-release/tests/bench/bench_types.exe
          again=build/again/tests/bench/bench_types.exe
          "$bench" --list > bench-ops.txt
          # As the gate: each process runs from its own copy of its build (Windows draws an image base per file, Task 5c).
          mkdir -p copies
          for i in 1 2 3; do cp "$bench" "copies/bench-$i.exe"; cp "$again" "copies/main-$i.exe"; done
          # Head's processes alone get the deliberate slowdown, when one is asked for.
          slow=()
          if [ -n "$SLOWDOWN" ]; then slow=(--slowdown "$SLOWDOWN"); fi
          run() {
            extra=()
            case "$1" in bench-*) extra=("${slow[@]}");; esac
            if [ -n "$MAIN_REF" ] && [ "${1%%-*}" = main ]; then
              # Another commit's bench, as ci.yml runs main's: its default calibration, no option it may not know.
              "copies/$1.exe" --detail --out "$1.json" 2> "$1-stderr.txt"
            else
              "copies/$1.exe" --detail --faults --layout --calibrate time "${extra[@]}" --out "$1.json" 2> "$1-stderr.txt"
            fi
            grep -m1 "image base" "$1-stderr.txt" || true
          }
          # The gate's order: main, head, head, main, main, head.
          run main-1; run bench-1; run bench-2; run main-2; run main-3; run bench-3
          status=0
          python -I tools/check_bench.py bench-1.json bench-2.json bench-3.json --expected bench-ops.txt --baseline main-1.json main-2.json main-3.json > check-bench.txt 2> check-bench-stderr.txt || status=$?
          cat check-bench.txt check-bench-stderr.txt
          echo "check_bench exit code $status (report-only)"
          # The CPU and the result in the run's summary too, so they are recorded even when the artifact is not.
          echo "job $JOB: $(grep -m1 '^machine:' check-bench.txt), $(grep -m1 'heap kind' bench-1-stderr.txt | tr -d '\r'), pads head ${HEAD_BENCH_PAD}_${HEAD_CORE_PAD} main ${MAIN_BENCH_PAD}_${MAIN_CORE_PAD}, slowdown '${SLOWDOWN}', main '${MAIN_REF}', check_bench exit code $status" >> "$GITHUB_STEP_SUMMARY"
          grep -m1 "^geometric mean" check-bench.txt >> "$GITHUB_STEP_SUMMARY" || true
          grep -E "^  [a-z_0-9]+: (ratio|head/main)" check-bench-stderr.txt >> "$GITHUB_STEP_SUMMARY" || true
          echo "head ${HEAD_BENCH_PAD}_${HEAD_CORE_PAD} main ${MAIN_BENCH_PAD}_${MAIN_CORE_PAD} slowdown ${SLOWDOWN}" > check-bench-pads.txt
        env:
          JOB: ${{ matrix.job }}
      - name: Upload the runs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-replica-${{ matrix.job }}
          path: |
            bench*.json
            main-*.json
            bench*-stderr.txt
            check-bench*.txt
          if-no-files-found: ignore
