name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache toolchain
        uses: actions/cache@v4
        with:
          path: .tools
          key: tools-windows-${{ hashFiles('tools/toolchain.json') }}
      # FetchContent's sub-builds in .deps record the absolute checkout path, which the repository's name is part of: the key names
      # it, so a renamed repository never restores sub-builds made under the old path.
      - name: Cache dependency downloads
        uses: actions/cache@v4
        with:
          path: .deps
          key: deps-${{ runner.os }}-${{ github.event.repository.name }}-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/ZodiacApplyPatch.cmake', 'cmake/patches/**') }}
      # The .tools cache is only saved on a key miss, so the UCD files get a cache of their own; gen_unicode.py still verifies each SHA-256.
      - name: Cache Unicode data
        uses: actions/cache@v4
        with:
          path: .tools/unicode
          key: ucd-16.0.0-${{ hashFiles('tools/gen_unicode.py') }}
      - name: Bootstrap unit tests
        run: python -I -m unittest discover -v -s tools -p "test_*.py" && python -I tools/gen_unicode.py --check
      - name: Bootstrap
        run: python bootstrap.py
      - name: Build and test
        run: .tools/cmake/bin/cmake --workflow --preset windows
      # ctest shows no output of a passing test: run test_files' link test alone, so its always-printed line shows it made a real
      # symbolic link here (on CI it fails rather than skip when it cannot).
      - name: Show that the file link test ran
        shell: pwsh
        run: |
          $out = & build/windows-debug/tests/test_files.exe "--test-case=a link moved or copied*" 2>&1 | Out-String
          Write-Output $out
          if ($LASTEXITCODE -ne 0) { throw "test_files failed with exit code $LASTEXITCODE" }
          # A renamed test would match no case and pass: the line itself must be there.
          if (-not $out.Contains("link test ran with a real symbolic link")) { throw "the link test did not run" }
      # AngelScript's number literal scanner (cmake/patches/angelscript-exact-literals.patch): which way this build reads literals, then its strtod_l
      # fallback and the branch for a null "C" locale handle, which a toolchain with a correctly rounded floating-point from_chars never compiles:
      # test_script_literals alone, built with ZODIAC_AS_STRTOD_FALLBACK in a tree of its own that reuses the sources the step above fetched and patched.
      - name: Test the literal scanner fallback
        shell: pwsh
        run: |
          & build/windows-debug/tests/test_script_literals.exe "--test-case=the literal scanner reports how it reads literals"
          if ($LASTEXITCODE -ne 0) { throw "test_script_literals failed with exit code $LASTEXITCODE" }
          $deps = "$PWD/.deps/windows-debug"
          .tools/cmake/bin/cmake --preset windows-debug -B build/literal-fallback -DZODIAC_AS_STRTOD_FALLBACK=ON "-DFETCHCONTENT_BASE_DIR=$PWD/build/literal-fallback/_deps" "-DFETCHCONTENT_SOURCE_DIR_ANGELSCRIPT_SDK=$deps/angelscript_sdk-src" "-DFETCHCONTENT_SOURCE_DIR_DOCTEST=$deps/doctest-src" "-DFETCHCONTENT_SOURCE_DIR_TOMLPLUSPLUS=$deps/tomlplusplus-src"
          if ($LASTEXITCODE -ne 0) { throw "configure failed with exit code $LASTEXITCODE" }
          .tools/cmake/bin/cmake --build build/literal-fallback --target test_script_literals
          if ($LASTEXITCODE -ne 0) { throw "build failed with exit code $LASTEXITCODE" }
          & build/literal-fallback/tests/test_script_literals.exe
          if ($LASTEXITCODE -ne 0) { throw "test_script_literals failed with exit code $LASTEXITCODE" }
      # The speed gate of spec 8.4 on an optimized build, every operation of bench_types --list, in two parts (tools/check_bench.py):
      # - Zodiac's types against the sample add-ons: 3 bench processes, each from its own copy of the build and with equal-time
      #   windows per side (--calibrate time), gated on the median of their ratios per operation (at most 1.05). One file's placement
      #   moves a ratio by several percent (Task 5b fix rounds 3 and 4, Task 5c), so no single placement decides, and there is no retry.
      # - Zodiac against main's Zodiac on this same runner: main's bench (cached per main commit, built when the cache misses) runs
      #   in alternation with this one (main, head, head, main, main, head), each process from its own copy too. Each process's time
      #   is corrected by its machine-speed factor (its add-on side against its own side's other processes); per operation head's best
      #   process over main's median process must stay within that operation's regression limit, and the geometric mean over
      #   operations of head's best over main's best within its limit. On main itself both sides are this build (an A/A run).
      # Each run's table and --detail lines are in the log and, on failure, in the bench artifact.
      - name: Build the benchmark on the release preset
        run: |
          .tools/cmake/bin/cmake --preset windows-release
          .tools/cmake/bin/cmake --build --preset windows-release --target bench_types
      # Report-only (Task 5b), never failing the job: the first bench process after the release link, where dict_iterate_10's slow mode has
      # been seen. It splits dict_iterate_10 into keys() (dict_keys_10) and the gets (dict_get_ordered_10) and prints each operation's page
      # faults and its tables' layout. Then the disassembly of the byte_at leaf, found through the link map, with its address mod 64 and 32.
      - name: Probe the first bench process (report-only)
        continue-on-error: true
        shell: bash
        run: |
          exe=build/windows-release/tests/bench/bench_types.exe
          timeout 60 "$exe" --diagnostic --layout --rounds 31 --op dict_keys_10 --op dict_get_ordered_10 --op dict_iterate_10 --op dict_lookup_10 || echo "::warning::the probe exited with $?"
          objdump=.tools/llvm-mingw/bin/llvm-objdump
          base=$("$objdump" -p "$exe" | awk '/^ImageBase/ {print $2}')
          for name in "zodiac::StringBindingAccess::byte_at(" "zodiac::StringBindingAccess::byte_out_of_range("; do
            line=$(grep -m1 -F "$name" "$exe.map") || { echo "$name is not in the map"; continue; }
            start=$(( 0x$base + 0x$(echo "$line" | awk '{print $1}') ))
            printf '%s at 0x%x: mod 64 = %d, mod 32 = %d\n' "$name" "$start" $((start % 64)) $((start % 32))
            "$objdump" -d --start-address=$start --stop-address=$((start + 48)) "$exe" | tail -n +7
          done
      # Runners differ in CPU from job to job and some measure differently: the log names this one (bench_types and check_bench.py name
      # it again from CPUID).
      - name: Show the CPU
        shell: pwsh
        run: Get-CimInstance Win32_Processor | Select-Object Name,NumberOfCores,NumberOfLogicalProcessors,MaxClockSpeed | Format-List
      - name: Find main's commit
        id: main
        shell: bash
        run: |
          git fetch --depth=1 origin main
          sha=$(git rev-parse FETCH_HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [ "$sha" = "$GITHUB_SHA" ] || [ "$GITHUB_REF" = refs/heads/main ]; then echo "same=true" >> "$GITHUB_OUTPUT"; else echo "same=false" >> "$GITHUB_OUTPUT"; fi
          echo "main is $sha"
      - name: Restore main's bench
        if: steps.main.outputs.same == 'false'
        id: main-cache
        uses: actions/cache/restore@v4
        with:
          path: bench-main
          # Main's build takes this tree's toolchain (bootstrap.py, tools/toolchain.json) and dependency sources (patched by this tree's
          # cmake/Dependencies.cmake, ZodiacApplyPatch.cmake and patches): a change to any of them rebuilds main's bench.
          key: bench-main-windows-${{ steps.main.outputs.sha }}-${{ hashFiles('bootstrap.py', 'tools/toolchain.json', 'cmake/Dependencies.cmake', 'cmake/ZodiacApplyPatch.cmake', 'cmake/patches/**') }}
      # Main's sources in a worktree, built like this tree (the dependency sources this job already fetched), only when no earlier job
      # cached it for this main commit.
      - name: Build main's bench
        if: steps.main.outputs.same == 'false' && steps.main-cache.outputs.cache-hit != 'true'
        id: main-build
        # A main that no longer builds with this toolchain must not block the branch: the gate step then warns and skips the comparison.
        continue-on-error: true
        shell: pwsh
        env:
          MAIN_SHA: ${{ steps.main.outputs.sha }}
        run: |
          git fetch origin $env:MAIN_SHA
          git worktree add main-src $env:MAIN_SHA
          if ($LASTEXITCODE -ne 0) { throw "git worktree failed" }
          New-Item -ItemType Junction -Path main-src/.tools -Target (Resolve-Path .tools) | Out-Null
          $deps = "$PWD/.deps/windows-release"
          Push-Location main-src
          ../.tools/cmake/bin/cmake --preset windows-release -B ../build/main "-DFETCHCONTENT_BASE_DIR=$PWD/../build/main/_deps" "-DFETCHCONTENT_SOURCE_DIR_ANGELSCRIPT_SDK=$deps/angelscript_sdk-src" "-DFETCHCONTENT_SOURCE_DIR_DOCTEST=$deps/doctest-src" "-DFETCHCONTENT_SOURCE_DIR_TOMLPLUSPLUS=$deps/tomlplusplus-src"
          if ($LASTEXITCODE -ne 0) { throw "configure failed" }
          Pop-Location
          .tools/cmake/bin/cmake --build build/main --target bench_types
          if ($LASTEXITCODE -ne 0) { throw "build failed" }
          New-Item -ItemType Directory -Force bench-main | Out-Null
          Copy-Item build/main/tests/bench/bench_types.exe bench-main/
      - name: Save main's bench
        if: steps.main.outputs.same == 'false' && steps.main-cache.outputs.cache-hit != 'true' && steps.main-build.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: bench-main
          key: bench-main-windows-${{ steps.main.outputs.sha }}-${{ hashFiles('bootstrap.py', 'tools/toolchain.json', 'cmake/Dependencies.cmake', 'cmake/ZodiacApplyPatch.cmake', 'cmake/patches/**') }}
      - name: Benchmark against the sample add-ons and against main
        shell: bash
        env:
          SAME: ${{ steps.main.outputs.same }}
          MAIN_SHA: ${{ steps.main.outputs.sha }}
        run: |
          bench=build/windows-release/tests/bench/bench_types.exe
          main=bench-main/bench_types.exe
          if [ "$SAME" = true ]; then main=$bench; echo "This is main: the comparison with main is an A/A run of this build."; fi
          "$bench" --list > bench-ops.txt
          # Each process runs from its own copy of its build: Windows draws an image base per file and keeps it for every process of that
          # file, and that base moves an operation's speed by several percent on AMD runners (placement-study, Task 5c), so three
          # processes of one file are one placement, three copies are three.
          mkdir -p bench-copies
          for i in 1 2 3; do cp "$bench" "bench-copies/bench-$i.exe"; if [ -x "$main" ]; then cp "$main" "bench-copies/main-$i.exe"; fi; done
          run_head() {
            # --faults and --layout only add stderr lines (each op's page faults, the dictionaries' layout) for telling a slow mode apart.
            "bench-copies/bench-$1.exe" --detail --faults --layout --calibrate time --out "bench-$1.json" 2> "bench-$1-stderr.txt" || { cat "bench-$1-stderr.txt"; exit 2; }
            cat "bench-$1-stderr.txt"
          }
          run_main() {
            # Main's bench may predate --calibrate; its default is the calibration it measured with.
            "bench-copies/main-$1.exe" --detail --out "main-$1.json" 2> "main-$1-stderr.txt" || { cat "main-$1-stderr.txt"; exit 2; }
            grep -v "^bench_types: detail" "main-$1-stderr.txt" || true
          }
          start=$(date +%s)
          if [ -x "$main" ]; then
            run_main 1; run_head 1; run_head 2; run_main 2; run_main 3; run_head 3
            baseline=(--baseline main-1.json main-2.json main-3.json)
          else
            echo "::warning::REGRESSION GATE SKIPPED: main's bench could not be built (see the step Build main's bench), so this run is not compared with main"
            echo "### Regression gate skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "main's bench ($MAIN_SHA) could not be built, so this run was not compared with main; only the add-on gate ran." >> "$GITHUB_STEP_SUMMARY"
            run_head 1; run_head 2; run_head 3
            baseline=()
          fi
          echo "The bench processes took $(( $(date +%s) - start )) s."
          status=0
          python -I tools/check_bench.py bench-1.json bench-2.json bench-3.json --expected bench-ops.txt "${baseline[@]}" | tee check-bench.txt || status=${PIPESTATUS[0]}
          # A report-only comparison with main (main calibrated otherwise) is named in the job summary too.
          if grep -q "REGRESSION GATE REPORT-ONLY" check-bench.txt; then
            echo "### Regression gate report-only" >> "$GITHUB_STEP_SUMMARY"
            grep "REGRESSION GATE REPORT-ONLY" check-bench.txt | head -1 >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
      - name: Upload the benchmark results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bench-windows
          path: |
            bench*.json
            bench*-stderr.txt
            main-*.json
            main-*-stderr.txt
            bench-ops.txt
          if-no-files-found: ignore
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-windows
          path: |
            build/**/Testing/**/*.log
            build/**/Testing/**/*.xml
          if-no-files-found: ignore

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache toolchain
        uses: actions/cache@v4
        with:
          path: .tools
          key: tools-linux-${{ hashFiles('tools/toolchain.json') }}
      - name: Cache dependency downloads
        uses: actions/cache@v4
        with:
          path: .deps
          key: deps-${{ runner.os }}-${{ github.event.repository.name }}-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/ZodiacApplyPatch.cmake', 'cmake/patches/**') }}
      # lld-18 links (full LTO, --icf=safe) and llvm-18 brings llvm-ar, llvm-ranlib and llvm-nm for the bitcode archives; cmake/toolchain-clang-linux.cmake
      # finds them by the compiler's version suffix (ld.lld-18, llvm-ar-18, ...).
      - name: Install and select clang 18 with libc++, lld and the LLVM tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 libc++-18-dev libc++abi-18-dev lld-18 llvm-18
          echo "CC=clang-18" >> "$GITHUB_ENV"
          echo "CXX=clang++-18" >> "$GITHUB_ENV"
      - name: Show compiler version
        run: clang-18 --version
      # The .tools cache is only saved on a key miss, so the UCD files get a cache of their own; gen_unicode.py still verifies each SHA-256.
      - name: Cache Unicode data
        uses: actions/cache@v4
        with:
          path: .tools/unicode
          key: ucd-16.0.0-${{ hashFiles('tools/gen_unicode.py') }}
      - name: Bootstrap unit tests
        run: python -I -m unittest discover -v -s tools -p "test_*.py" && python -I tools/gen_unicode.py --check
      - name: Bootstrap
        run: python bootstrap.py
      - name: Build and test
        # The Linux job also runs the long tests (test_string's exhaustive length-3 UTF-8 check).
        env:
          ZODIAC_LONG_TESTS: "1"
        run: .tools/cmake/bin/cmake --workflow --preset linux
      # As in the windows job.
      - name: Show that the file link test ran
        run: |
          set -o pipefail
          build/linux-debug/tests/test_files "--test-case=a link moved or copied*" | tee link-test.txt
          grep -q "link test ran with a real symbolic link" link-test.txt || { echo "::error::the link test did not run"; exit 1; }
      # As in the windows job. The null-handle test needs a locale whose decimal point is a comma.
      - name: Test the literal scanner fallback
        run: |
          build/linux-debug/tests/test_script_literals "--test-case=the literal scanner reports how it reads literals"
          sudo locale-gen de_DE.UTF-8
          deps="$PWD/.deps/linux-debug"
          .tools/cmake/bin/cmake --preset linux-debug -B build/literal-fallback -DZODIAC_AS_STRTOD_FALLBACK=ON "-DFETCHCONTENT_BASE_DIR=$PWD/build/literal-fallback/_deps" "-DFETCHCONTENT_SOURCE_DIR_ANGELSCRIPT_SDK=$deps/angelscript_sdk-src" "-DFETCHCONTENT_SOURCE_DIR_DOCTEST=$deps/doctest-src" "-DFETCHCONTENT_SOURCE_DIR_TOMLPLUSPLUS=$deps/tomlplusplus-src"
          .tools/cmake/bin/cmake --build build/literal-fallback --target test_script_literals
          build/literal-fallback/tests/test_script_literals
      # The benchmark of spec 8.4 on an optimized build, as in the windows job, with only its speed gate report-only: GitHub's
      # Linux runners vary from job to job, and one noisy runner failed operations no commit had touched, so the windows job
      # is the speed gate. Everything else still fails the job: bench_types exiting nonzero (a snippet that does not build or
      # run, the two sides disagreeing on a checksum) and check_bench.py exiting with anything but 1 (results missing, unknown
      # or malformed operations). Its exit code 1, a ratio over the limit, is a warning annotation only, so there is no retry.
      # The results are uploaded on every run (see the windows job's comment on --detail for telling noise from a real
      # regression).
      - name: Build the benchmark on the release preset
        run: |
          .tools/cmake/bin/cmake --preset linux-release
          .tools/cmake/bin/cmake --build --preset linux-release --target bench_types
      # As in the windows job.
      - name: Probe the first bench process (report-only)
        continue-on-error: true
        run: |
          exe=build/linux-release/tests/bench/bench_types
          timeout 60 "$exe" --diagnostic --layout --rounds 31 --op dict_keys_10 --op dict_get_ordered_10 --op dict_iterate_10 --op dict_lookup_10 || echo "::warning::the probe exited with $?"
          for name in "zodiac::StringBindingAccess::byte_at(" "zodiac::StringBindingAccess::byte_out_of_range("; do
            line=$(grep -m1 -F "$name" "$exe.map") || { echo "$name is not in the map"; continue; }
            start=$(( 0x$(echo "$line" | awk '{print $1}') ))
            printf '%s at 0x%x: mod 64 = %d, mod 32 = %d\n' "$name" "$start" $((start % 64)) $((start % 32))
            llvm-objdump-18 -d --start-address=$start --stop-address=$((start + 48)) "$exe" | tail -n +7
          done
      # Both calibration modes of bench_types give sane results on a fast-against-slow pair (tools/check_bench_modes.py, about 10 s).
      - name: Check the bench's calibration modes
        run: python -I tools/check_bench_modes.py --bench build/linux-release/tests/bench/bench_types --out-dir bench-modes
      # The release tree's test of this (test_no_test_hooks) runs in kit-windows on Windows; here the Linux release core and bench are checked.
      - name: Show that the release build holds no test hook
        run: |
          nm=$(sed -n 's/^CMAKE_NM:[A-Z]*=//p' build/linux-release/CMakeCache.txt)
          .tools/cmake/bin/cmake "-DNM=$nm" -DHOOKS=OFF -DARCHIVES=build/linux-release/src/core/libzodiac_core_release.a -DBINARIES=build/linux-release/tests/bench/bench_types -P tests/check_no_test_hooks.cmake
      - name: Show the CPU
        run: lscpu | grep -E '^(Model name|CPU\(s\)|Thread|Core|Socket)|MHz|cache'
      - name: Benchmark against the sample add-ons (speed gate report-only)
        shell: bash
        run: |
          bench=build/linux-release/tests/bench/bench_types
          "$bench" --list > bench-ops.txt
          status=0
          "$bench" --detail --faults --layout --out bench.json 2> bench-stderr.txt || status=$?
          cat bench-stderr.txt
          if [ "$status" -ne 0 ]; then
            echo "::error::bench_types failed with exit code $status"
            exit "$status"
          fi
          status=0
          python -I tools/check_bench.py bench.json --expected bench-ops.txt || status=$?
          if [ "$status" -eq 1 ]; then
            echo "::warning::Linux benchmark: operations over the speed limit (report-only here; the windows job is the gate)"
          elif [ "$status" -ne 0 ]; then
            exit "$status"
          fi
      - name: Upload the benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-linux
          path: |
            bench*.json
            bench*-stderr.txt
            bench-ops.txt
          if-no-files-found: ignore
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-linux
          path: |
            build/**/Testing/**/*.log
            build/**/Testing/**/*.xml
          if-no-files-found: ignore

  # The kit as users get it: an optimized (windows-release) build, tested, packaged as the portable zip and the setup wizard.
  kit-windows:
    needs: windows
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache toolchain
        uses: actions/cache@v4
        with:
          path: .tools
          key: tools-windows-${{ hashFiles('tools/toolchain.json') }}
      - name: Cache dependency downloads
        uses: actions/cache@v4
        with:
          path: .deps
          key: deps-${{ runner.os }}-release-${{ github.event.repository.name }}-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/ZodiacApplyPatch.cmake', 'cmake/patches/**') }}
      - name: Bootstrap
        run: python bootstrap.py
      - name: Build and test the release preset
        run: .tools/cmake/bin/cmake --workflow --preset windows-release
      - name: Show how the release build reads number literals
        run: |
          & build/windows-release/tests/test_script_literals.exe "--test-case=the literal scanner reports how it reads literals"
          if ($LASTEXITCODE -ne 0) { throw "test_script_literals failed with exit code $LASTEXITCODE" }
      # Secrets cannot be used in "if:", so this step turns "the certificate secret is set" into an environment flag.
      - name: Check for a signing certificate
        env:
          ZODIAC_SIGNING_CERT: ${{ secrets.ZODIAC_SIGNING_CERT }}
        run: |
          if ($env:ZODIAC_SIGNING_CERT) {
            "ZODIAC_SIGNING=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "A signing certificate is set: the setup will be signed."
          } else {
            "No signing certificate is set: the setup will be unsigned."
          }
      # ZODIAC_SIGNING_CERT is a base64 PFX file, ZODIAC_SIGNING_PASSWORD its password. The password stays in the packaging step's environment;
      # the sign command (ZODIAC_SIGN_TOOL) is a script that reads it from there. zodiac_zip runs it on the kit's executables and DLLs
      # (tools/sign_kit.py) before the zip and the setup are made, and Inno Setup runs it on the setup and its uninstaller (tools/build_installer.py).
      - name: Prepare signing
        if: env.ZODIAC_SIGNING == '1'
        env:
          ZODIAC_SIGNING_CERT: ${{ secrets.ZODIAC_SIGNING_CERT }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'zodiac-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:ZODIAC_SIGNING_CERT))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          if (-not $signtool) { throw "signtool.exe was not found" }
          $script = Join-Path $env:RUNNER_TEMP 'zodiac-sign.cmd'
          "@`"$($signtool.FullName)`" sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f `"$pfx`" /p `"%ZODIAC_SIGNING_PASSWORD%`" %*" | Out-File -FilePath $script -Encoding ascii
          "ZODIAC_SIGN_TOOL=cmd.exe /d /s /c `"`"$script`" `$f`"" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Package the zip and the setup
        env:
          ZODIAC_SIGNING_PASSWORD: ${{ secrets.ZODIAC_SIGNING_PASSWORD }}
        run: .tools/cmake/bin/cmake --build --preset windows-release --target zodiac_installer
      # A setup built from the script as it was before the rename (a test fixture, uploaded as its own artifact so the release job never sees it): kit-clean-machine installs it and upgrades it with the real one.
      - name: Build the old-named setup for the upgrade test
        run: |
          $setup = Get-ChildItem dist -Filter 'zodiac-setup-*.exe' | Select-Object -First 1
          $version = $setup.BaseName -replace '^zodiac-setup-', ''
          & .tools/innosetup/ISCC.exe "/DZodiacVersion=$version" "/DKitDir=$((Resolve-Path dist/Zodiac).Path)" "/O$((Resolve-Path dist).Path)" packaging/test/zodiac-old-name.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
      - name: Show package sizes
        run: |
          Get-ChildItem dist -File | ForEach-Object { "$($_.Name): $($_.Length) bytes" }
      - name: Upload the kit
        uses: actions/upload-artifact@v4
        with:
          name: zodiac-kit
          path: |
            dist/zodiac-*-windows-x86_64.zip
            dist/zodiac-setup-*.exe
          if-no-files-found: error
      # The heap probe (tests/fixtures/tools/heap_kind_probe.cpp), for kit-clean-machine to check the kit's zodiac.exe and a built game at run
      # time. A separate artifact, so the release job never attaches it.
      - name: Upload the heap probe
        uses: actions/upload-artifact@v4
        with:
          name: zodiac-heap-probe
          path: build/windows-release/tests/heap_kind_probe.exe
          if-no-files-found: error
      # A separate artifact, so the release job (which publishes every file of zodiac-kit) can never attach it.
      - name: Upload the old-named setup for the upgrade test
        uses: actions/upload-artifact@v4
        with:
          name: zodiac-old-setup
          path: dist/zodiac-old-setup-*.exe
          if-no-files-found: error
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-kit-windows
          path: |
            build/**/Testing/**/*.log
            build/**/Testing/**/*.xml
          if-no-files-found: ignore

  # A fresh Windows machine with nothing but the kit: no checkout, no Python, no toolchain, and only the Windows system folders on PATH.
  kit-clean-machine:
    needs: kit-windows
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Download the kit
        uses: actions/download-artifact@v4
        with:
          name: zodiac-kit
          path: ${{ runner.temp }}/zodiac-kit
      - name: Download the old-named setup
        uses: actions/download-artifact@v4
        with:
          name: zodiac-old-setup
          path: ${{ runner.temp }}/zodiac-old-setup
      - name: Download the heap probe
        uses: actions/download-artifact@v4
        with:
          name: zodiac-heap-probe
          path: ${{ runner.temp }}/zodiac-heap-probe
      - name: Portable zip in a folder with a space and a non-English letter
        run: |
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot;$env:SystemRoot\System32\Wbem;$env:SystemRoot\System32\WindowsPowerShell\v1.0"
          $root = 'C:\Users\runneradmin\Zodiac Kit ş'
          $zip = Get-ChildItem -LiteralPath "$env:RUNNER_TEMP\zodiac-kit" -Filter 'zodiac-*-windows-x86_64.zip' | Select-Object -First 1
          if (-not $zip) { throw "The zip is missing from the artifact" }
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $root
          $zodiac = Join-Path $root 'Zodiac\bin\zodiac.exe'
          Set-Location -LiteralPath $root
          & $zodiac new hello
          if ($LASTEXITCODE -ne 0) { throw "zodiac new hello failed with exit code $LASTEXITCODE" }
          & $zodiac build hello --no-window
          if ($LASTEXITCODE -ne 0) { throw "zodiac build hello failed with exit code $LASTEXITCODE" }
          $hello = Join-Path $root 'hello\release\hello.exe'
          & $hello
          if ($LASTEXITCODE -ne 0) { throw "hello.exe failed with exit code $LASTEXITCODE" }
          $size = (Get-Item -LiteralPath $hello).Length
          "hello.exe ran and exited with 0. Size: $size bytes."
          # Size gate (spec 8.9): a core-only hello world release is at most 5 MB.
          if ($size -gt 5MB) { throw "hello.exe is $size bytes, more than the 5 MB limit" }
          # The test hooks (ZODIAC_TEST_HOOKS) never reach a game: its executable holds the core (serialize()'s header) but not the
          # seed hook's environment variable.
          $bytes = [IO.File]::ReadAllText($hello, [Text.Encoding]::Latin1)
          if (-not $bytes.Contains('zodiac-dictionary 1')) { throw "hello.exe does not hold the core's text 'zodiac-dictionary 1', so the scan below proves nothing" }
          if ($bytes.Contains('ZODIAC_TABLE_HASH_SEED')) { throw "hello.exe holds ZODIAC_TABLE_HASH_SEED, a test hook" }
          "hello.exe holds no test hook."
          # mimalloc (the allocator experiment's, ZODIAC_BENCH_ALLOCATOR) never ships: no kit executable or game holds its name.
          foreach ($file in @($hello, $zodiac, (Join-Path $root 'Zodiac\bin\zodiacw.exe'))) {
            if ([IO.File]::ReadAllText($file, [Text.Encoding]::Latin1).Contains('mimalloc')) { throw "$file holds the text 'mimalloc'" }
          }
          "No kit executable and no game holds mimalloc."
          # The application manifest at run time: the kit's zodiac.exe and the built game run on the Segment Heap (Windows 10 2004 and later;
          # report-only on older Windows, which ignores heapType and keeps the NT heap).
          $probe = Join-Path $env:RUNNER_TEMP 'zodiac-heap-probe\heap_kind_probe.exe'
          & $probe --require-segment $hello
          if ($LASTEXITCODE -ne 0) { throw "hello.exe does not run on the Segment Heap (heap_kind_probe exit code $LASTEXITCODE)" }
          & $probe --require-segment $zodiac --version
          if ($LASTEXITCODE -ne 0) { throw "zodiac.exe does not run on the Segment Heap (heap_kind_probe exit code $LASTEXITCODE)" }
          $zodiacw = Join-Path $root 'Zodiac\bin\zodiacw.exe'
          & $probe --require-segment $zodiacw --version
          if ($LASTEXITCODE -ne 0) { throw "zodiacw.exe does not run on the Segment Heap (heap_kind_probe exit code $LASTEXITCODE)" }
          # A game whose name Windows' installer detection looks for (setup) runs as the user who starts it: the manifest's asInvoker.
          & $zodiac new setup
          if ($LASTEXITCODE -ne 0) { throw "zodiac new setup failed with exit code $LASTEXITCODE" }
          & $zodiac build setup --no-window
          if ($LASTEXITCODE -ne 0) { throw "zodiac build setup failed with exit code $LASTEXITCODE" }
          $setupGame = Join-Path $root 'setup\release\setup.exe'
          if (-not [IO.File]::ReadAllText($setupGame, [Text.Encoding]::Latin1).Contains('<requestedExecutionLevel level="asInvoker" uiAccess="false"/>')) { throw "setup.exe's manifest does not ask for asInvoker" }
          & $setupGame
          if ($LASTEXITCODE -ne 0) { throw "setup.exe failed with exit code $LASTEXITCODE" }
          & $probe --require-same-elevation --require-segment $setupGame
          if ($LASTEXITCODE -ne 0) { throw "setup.exe is elevated beyond the user or not on the Segment Heap (heap_kind_probe exit code $LASTEXITCODE)" }
      # Two rounds. Round 1: .zs already belongs to another program (a fake ProgID); every option is installed, then uninstall must give .zs back and
      # remove everything else it added. Round 2: the user PATH already holds the kit's bin folder; uninstall must leave that entry, which it did not add.
      - name: Setup wizard, silent install and uninstall
        run: |
          $setup = Get-ChildItem -LiteralPath "$env:RUNNER_TEMP\zodiac-kit" -Filter 'zodiac-setup-*.exe' | Select-Object -First 1
          if (-not $setup) { throw "The setup is missing from the artifact" }
          "Setup size: $($setup.Length) bytes."
          $version = $setup.BaseName -replace '^zodiac-setup-', ''
          $uninstallKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{98CB20B5-1340-41F1-80E7-8FD0E99FA8BC}_is1'
          $menu = Join-Path ([Environment]::GetFolderPath('Programs')) 'Zodiac Game Toolkit'
          $oldMenu = Join-Path ([Environment]::GetFolderPath('Programs')) 'Zodiac'
          $systemPath = $env:PATH
          function Get-RawUserPath { (Get-Item -LiteralPath 'HKCU:\Environment').GetValue('Path', '', 'DoNotExpandEnvironmentNames') }
          function Set-RawUserPath([string]$value) { Set-ItemProperty -LiteralPath 'HKCU:\Environment' -Name Path -Value $value -Type ExpandString }
          function Install-Zodiac([string]$tasks, [string]$round, [string]$file = $setup.FullName, [string]$expectedName = 'Zodiac Game Toolkit', [string]$expectedPublisher = 'Zodiac Team') {
            $log = Join-Path $env:RUNNER_TEMP "zodiac-setup-$round.log"
            $process = Start-Process -FilePath $file -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/CURRENTUSER', '/NORESTART', "/TASKS=`"$tasks`"", "/LOG=`"$log`"" -Wait -PassThru
            if ($process.ExitCode -ne 0) { Get-Content -LiteralPath $log; throw "The setup failed with exit code $($process.ExitCode)" }
            $app = (Get-ItemProperty -LiteralPath $uninstallKey).InstallLocation.TrimEnd('\')
            if (-not (Test-Path -LiteralPath (Join-Path $app 'bin\zodiac.exe'))) { throw "$app\bin\zodiac.exe is missing" }
            $displayName = (Get-ItemProperty -LiteralPath $uninstallKey).DisplayName
            if ($displayName -ne $expectedName) { throw "The uninstall entry is listed as '$displayName', not $expectedName" }
            $publisher = (Get-ItemProperty -LiteralPath $uninstallKey).Publisher
            if ($publisher -ne $expectedPublisher) { throw "The uninstall entry's publisher is '$publisher', not $expectedPublisher" }
            Write-Host "Round ${round}: installed into $app, listed as $displayName by $publisher"
            $app
          }
          function Uninstall-Zodiac([string]$app) {
            $process = Start-Process -FilePath (Join-Path $app 'unins000.exe') -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "The uninstaller failed with exit code $($process.ExitCode)" }
            # The uninstaller finishes from a copy of itself in the temp folder, so wait for the install folder to go.
            $deadline = (Get-Date).AddMinutes(2)
            while ((Test-Path -LiteralPath $app) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 500 }
            if (Test-Path -LiteralPath $app) { Get-ChildItem -LiteralPath $app -Recurse | ForEach-Object FullName; throw "$app is still there after uninstall" }
            if (Test-Path -LiteralPath $uninstallKey) { throw "$uninstallKey is still there after uninstall" }
            if (Test-Path -LiteralPath 'HKCU:\Software\Zodiac') { throw "HKCU\Software\Zodiac is still there after uninstall" }
          }

          # Round 1.
          New-Item -Path 'HKCU:\Software\Classes\.zs' -Force | Out-Null
          Set-ItemProperty -LiteralPath 'HKCU:\Software\Classes\.zs' -Name '(default)' -Value 'Fake.ZsEditor'
          $pathBefore = Get-RawUserPath
          $app = Install-Zodiac 'addtopath,associate,buildmenu,shortcuts' 1
          $bin = Join-Path $app 'bin'
          # A new shell gets PATH from the registry, not from this process: run zodiac with the user PATH the setup wrote and the system folder only.
          $userPath = (Get-ItemProperty -LiteralPath 'HKCU:\Environment').Path
          if (@($userPath -split ';' | Where-Object { $_ -eq $bin }).Count -ne 1) { throw "The user PATH does not hold $bin exactly once: $userPath" }
          $env:PATH = "$userPath;$env:SystemRoot\System32"
          $reported = & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -Command 'zodiac --version'
          if ($LASTEXITCODE -ne 0 -or $reported -ne "zodiac $version") { throw "zodiac --version in a new shell said '$reported' (exit code $LASTEXITCODE)" }
          $env:PATH = $systemPath
          "zodiac --version in a new shell: $reported"
          $progId = (Get-Item -LiteralPath 'HKCU:\Software\Classes\.zs').GetValue('')
          if ($progId -ne 'Zodiac.Script') { throw "HKCU\Software\Classes\.zs is '$progId', not Zodiac.Script" }
          $open = (Get-Item -LiteralPath 'HKCU:\Software\Classes\Zodiac.Script\shell\open\command').GetValue('')
          if ($open -ne "`"$bin\zodiac.exe`" run `"%1`"") { throw "The open command is '$open'" }
          $verb = Get-Item -LiteralPath 'HKCU:\Software\Classes\SystemFileAssociations\.zs\shell\zodiacbuild'
          $build = (Get-Item -LiteralPath 'HKCU:\Software\Classes\SystemFileAssociations\.zs\shell\zodiacbuild\command').GetValue('')
          if ($verb.GetValue('') -ne 'Build with Zodiac' -or $build -ne "`"$bin\zodiacw.exe`" build `"%1`"") { throw "The build verb is '$($verb.GetValue(''))' running '$build'" }
          foreach ($shortcut in 'Zodiac manual.lnk', 'Zodiac examples.lnk') {
            if (-not (Test-Path -LiteralPath (Join-Path $menu $shortcut))) { throw "The Start menu shortcut $menu\$shortcut is missing" }
          }
          if (Test-Path -LiteralPath $oldMenu) { throw "A clean install made the old Start menu folder $oldMenu" }
          "Association, right-click verb and Start menu shortcuts are there."
          Uninstall-Zodiac $app
          $pathAfter = Get-RawUserPath
          if ($pathAfter -ne $pathBefore) { throw "The user PATH is '$pathAfter' after uninstall, but was '$pathBefore' before install" }
          $progId = (Get-Item -LiteralPath 'HKCU:\Software\Classes\.zs').GetValue('')
          if ($progId -ne 'Fake.ZsEditor') { throw "HKCU\Software\Classes\.zs is '$progId' after uninstall, not the earlier Fake.ZsEditor" }
          if ((Get-Item -LiteralPath 'HKCU:\Software\Classes\.zs').GetSubKeyNames().Count -ne 0) { throw "HKCU\Software\Classes\.zs still has subkeys after uninstall" }
          foreach ($key in 'HKCU:\Software\Classes\Zodiac.Script', 'HKCU:\Software\Classes\SystemFileAssociations\.zs', $menu) {
            if (Test-Path -LiteralPath $key) { throw "$key is still there after uninstall" }
          }
          "Round 1: uninstall gave .zs back to Fake.ZsEditor and removed the folder, the PATH entry, the ProgID, the verb and the shortcuts."
          Remove-Item -LiteralPath 'HKCU:\Software\Classes\.zs' -Recurse

          # Round 2: the default per-user folder, already on the user PATH.
          $bin = Join-Path $env:LOCALAPPDATA 'Programs\Zodiac\bin'
          $original = Get-RawUserPath
          Set-RawUserPath "$original;$bin"
          $pathBefore = Get-RawUserPath
          $app = Install-Zodiac 'addtopath' 2
          if ((Join-Path $app 'bin') -ne $bin) { throw "Round 2 installed into $app, not the default folder" }
          if (Test-Path -LiteralPath $oldMenu) { throw "A clean install made the old Start menu folder $oldMenu" }
          if ((Get-RawUserPath) -ne $pathBefore) { throw "The setup changed a user PATH that already held $bin" }
          Uninstall-Zodiac $app
          if ((Get-RawUserPath) -ne $pathBefore) { throw "Uninstall removed the PATH entry $bin that the setup did not add" }
          if (Test-Path -LiteralPath 'HKCU:\Software\Classes\.zs') { throw "HKCU\Software\Classes\.zs exists although associate was not chosen" }
          Set-RawUserPath $original
          "Round 2: the PATH entry the user already had was kept."

          # Round 3: the upgrade a user with the old-named setup really does. The old setup (packaging/test/zodiac-old-name.iss) installs everything, the user
          # keeps a file in its Start menu folder, then the real setup installs over it: same AppId, so one uninstall entry, renamed, with the shortcuts moved.
          $oldSetup = Get-ChildItem -LiteralPath "$env:RUNNER_TEMP\zodiac-old-setup" -Filter 'zodiac-old-setup-*.exe' | Select-Object -First 1
          if (-not $oldSetup) { throw "The old-named setup is missing from the artifact" }
          $pathBefore = Get-RawUserPath
          $app = Install-Zodiac 'addtopath,associate,buildmenu,shortcuts' 3 $oldSetup.FullName "Zodiac $version" 'Zodiac'
          foreach ($shortcut in 'Zodiac manual.lnk', 'Zodiac examples.lnk') {
            if (-not (Test-Path -LiteralPath (Join-Path $oldMenu $shortcut))) { throw "The old setup did not make the shortcut $oldMenu\$shortcut" }
          }
          if (Test-Path -LiteralPath $menu) { throw "The old setup made the new Start menu folder $menu" }
          $notes = Join-Path $oldMenu 'my notes.txt'
          Set-Content -LiteralPath $notes -Value 'The user put this here.'
          $upgraded = Install-Zodiac 'addtopath,associate,buildmenu,shortcuts' 3 $setup.FullName 'Zodiac Game Toolkit'
          if ($upgraded -ne $app) { throw "The upgrade went to $upgraded, not over $app" }
          $uninstallRoot = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall'
          $entries = @(Get-ChildItem -LiteralPath $uninstallRoot | Where-Object { $_.PSChildName -like '*98CB20B5-1340-41F1-80E7-8FD0E99FA8BC*' })
          if ($entries.Count -ne 1) { throw "There are $($entries.Count) uninstall entries for the AppId after the upgrade, not 1" }
          foreach ($shortcut in 'Zodiac manual.lnk', 'Zodiac examples.lnk') {
            if (-not (Test-Path -LiteralPath (Join-Path $menu $shortcut))) { throw "The upgrade did not make the shortcut $menu\$shortcut" }
            if (Test-Path -LiteralPath (Join-Path $oldMenu $shortcut)) { throw "The upgrade left the old shortcut $oldMenu\$shortcut" }
          }
          if (-not (Test-Path -LiteralPath $notes)) { throw "The upgrade deleted the user's file $notes" }
          $bin = Join-Path $app 'bin'
          if (@((Get-RawUserPath) -split ';' | Where-Object { $_ -eq $bin }).Count -ne 1) { throw "The user PATH does not hold $bin exactly once after the upgrade: $(Get-RawUserPath)" }
          "Round 3: the upgrade renamed the entry, moved the shortcuts, kept one entry and the PATH entry once, and kept the user's file."
          Remove-Item -LiteralPath $notes
          Uninstall-Zodiac $app
          if ((Get-RawUserPath) -ne $pathBefore) { throw "The user PATH is '$(Get-RawUserPath)' after uninstalling the upgraded kit, but was '$pathBefore' before the old setup" }
          foreach ($key in $menu, $oldMenu, 'HKCU:\Software\Classes\.zs', 'HKCU:\Software\Classes\Zodiac.Script', 'HKCU:\Software\Classes\SystemFileAssociations\.zs') {
            if (Test-Path -LiteralPath $key) { throw "$key is still there after uninstalling the upgraded kit" }
          }
          "Round 3: uninstall after the upgrade left neither Start menu folder, the PATH as before, and no .zs keys."

  # Tags v* publish the tested packages as a GitHub release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [kit-clean-machine, linux]
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Download the kit
        uses: actions/download-artifact@v4
        with:
          name: zodiac-kit
          path: kit
      - name: Check the tag against the kit version
        run: |
          $setup = Get-ChildItem -LiteralPath kit -Filter 'zodiac-setup-*.exe' | Select-Object -First 1
          if (-not $setup) { throw "The setup is missing from the artifact" }
          $version = $setup.BaseName -replace '^zodiac-setup-', ''
          if ($env:GITHUB_REF_NAME -cne "v$version") { throw "The tag $env:GITHUB_REF_NAME does not match the kit version $version (PROJECT_VERSION in CMakeLists.txt): tag v$version instead" }
          "Tag $env:GITHUB_REF_NAME matches the kit version $version."
          if (-not (Test-Path -LiteralPath "kit/zodiac-$version-windows-x86_64.zip")) { throw "The portable zip is missing from the artifact" }
          # Only the zip and the setup are released: anything else in the artifact (such as a test setup) must not be published.
          $unexpected = @(Get-ChildItem -LiteralPath kit -Recurse -File | Where-Object { $_.Name -cne "zodiac-setup-$version.exe" -and $_.Name -cne "zodiac-$version-windows-x86_64.zip" })
          if ($unexpected.Count -ne 0) { throw "The kit artifact holds files that are not released: $($unexpected.Name -join ', ')" }
      - name: Write SHA256SUMS
        run: |
          $lines = Get-ChildItem -LiteralPath kit -File | Sort-Object Name | ForEach-Object { "$((Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant())  $($_.Name)" }
          [IO.File]::WriteAllText((Join-Path (Resolve-Path kit) 'SHA256SUMS'), ($lines -join "`n") + "`n")
          Get-Content -LiteralPath kit/SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $files = Get-ChildItem -LiteralPath kit -File | ForEach-Object FullName
          gh release create $env:GITHUB_REF_NAME @files --title "Zodiac $($env:GITHUB_REF_NAME.TrimStart('v'))" --notes "The Zodiac kit: the setup wizard (zodiac-setup-<version>.exe) or the portable zip. SHA256SUMS lists the SHA-256 of both."
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed with exit code $LASTEXITCODE" }
