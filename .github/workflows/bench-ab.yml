# Bench A/B (Task 5b), never part of the gate: bench_types built on the release preset from a baseline ref (A) and from the dispatched ref (B), run
# alternately on one runner by tools/bench_ab.py, so a change is measured against its baseline on the same machine. The table (ab.txt) and the
# runs are uploaded as bench-ab-<os>. Trigger:
#   gh workflow run bench-ab.yml --ref <branch> -f base=<sha or ref> [-f pairs=8 -f rounds=101 -f ops="..." -f os=both]
name: bench-ab

on:
  workflow_dispatch:
    inputs:
      base:
        description: "Baseline ref or sha (A); 'same' runs B's own binary as A (an A/A noise bound; the head's sha gives A/A', a second build)"
        required: true
      pairs:
        description: "A/B pairs (each run its own process)"
        default: "8"
      rounds:
        description: "bench_types --rounds"
        default: "101"
      ops:
        description: "Operations, space-separated (empty: every gated one)"
        default: ""
      os:
        description: "both, windows or linux"
        default: "both"
      calibrate:
        description: "bench_types --calibrate: time (equal-time windows, the gate's) or count (equal reps)"
        default: "time"
      window_ms:
        description: "bench_types --window-ms (time mode)"
        default: "1"
      reps:
        description: "bench_types --reps (count mode; empty: the slower side's time-calibrated reps)"
        default: ""

permissions:
  contents: read

# The inputs reach the scripts only through the environment, never spliced into their text.
env:
  BASE: ${{ inputs.base }}
  PAIRS: ${{ inputs.pairs }}
  ROUNDS: ${{ inputs.rounds }}
  OPS: ${{ inputs.ops }}
  CALIBRATE: ${{ inputs.calibrate }}
  WINDOW_MS: ${{ inputs.window_ms }}
  REPS: ${{ inputs.reps }}

jobs:
  windows:
    if: inputs.os != 'linux'
    runs-on: windows-latest
    # Two release builds (about 25 minutes) and 8 pairs of every gated operation (about 15) fit with a margin.
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache toolchain
        uses: actions/cache@v4
        with:
          path: .tools
          key: tools-windows-${{ hashFiles('tools/toolchain.json') }}
      - name: Cache dependency downloads
        uses: actions/cache@v4
        with:
          path: .deps
          key: deps-${{ runner.os }}-release-${{ github.event.repository.name }}-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/ZodiacApplyPatch.cmake', 'cmake/patches/**') }}
      - name: Cache Unicode data
        uses: actions/cache@v4
        with:
          path: .tools/unicode
          key: ucd-16.0.0-${{ hashFiles('tools/gen_unicode.py') }}
      - name: Bootstrap
        run: python bootstrap.py
      - name: Build B (this ref)
        run: |
          .tools/cmake/bin/cmake --preset windows-release
          .tools/cmake/bin/cmake --build --preset windows-release --target bench_types
      - name: Build A (the baseline)
        shell: pwsh
        run: |
          if ($env:BASE -eq 'same') { "A/A: A is B's own binary, nothing to build."; exit 0 }
          git worktree add base-src "$env:BASE"
          if ($LASTEXITCODE -ne 0) { throw "git worktree failed" }
          New-Item -ItemType Junction -Path base-src/.tools -Target (Resolve-Path .tools) | Out-Null
          $deps = "$PWD/.deps/windows-release"
          Push-Location base-src
          ../.tools/cmake/bin/cmake --preset windows-release -B ../build/base "-DFETCHCONTENT_BASE_DIR=$PWD/../build/base/_deps" "-DFETCHCONTENT_SOURCE_DIR_ANGELSCRIPT_SDK=$deps/angelscript_sdk-src" "-DFETCHCONTENT_SOURCE_DIR_DOCTEST=$deps/doctest-src" "-DFETCHCONTENT_SOURCE_DIR_TOMLPLUSPLUS=$deps/tomlplusplus-src"
          if ($LASTEXITCODE -ne 0) { throw "configure failed" }
          Pop-Location
          .tools/cmake/bin/cmake --build build/base --target bench_types
          if ($LASTEXITCODE -ne 0) { throw "build failed" }
      - name: Show the CPU
        shell: pwsh
        run: Get-CimInstance Win32_Processor | Select-Object Name,NumberOfCores,NumberOfLogicalProcessors,MaxClockSpeed | Format-List
      - name: A/B
        run: |
          ops=()
          read -r -a names <<< "$OPS"
          for op in "${names[@]}"; do ops+=(--op "$op"); done
          # Named ops may be diagnostic ones (dict_keys_10, ...); without names every gated op runs, and the diagnostic ones stay out.
          if [ "${#names[@]}" -gt 0 ]; then ops+=(--diagnostic); fi
          a=build/base/tests/bench/bench_types.exe
          if [ "$BASE" = same ]; then a=build/windows-release/tests/bench/bench_types.exe; fi
          # The calibration options go to both builds only when they differ from the defaults: a baseline older than Task 5b fix round 4
          # knows none of them (it then calibrates the old way, both sides together).
          if [ "$CALIBRATE" != time ] || [ "$WINDOW_MS" != 1 ] || [ -n "$REPS" ]; then
            ops+=(--bench-arg=--calibrate "--bench-arg=$CALIBRATE" --bench-arg=--window-ms "--bench-arg=$WINDOW_MS")
            if [ -n "$REPS" ]; then ops+=(--bench-arg=--reps "--bench-arg=$REPS"); fi
          fi
          python -I tools/bench_ab.py --a "$a" --b build/windows-release/tests/bench/bench_types.exe --out-dir bench-ab --pairs "$PAIRS" --rounds "$ROUNDS" "${ops[@]}"
      - name: Upload the A/B
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-ab-windows
          path: bench-ab
          if-no-files-found: ignore

  linux:
    if: inputs.os != 'windows'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache toolchain
        uses: actions/cache@v4
        with:
          path: .tools
          key: tools-linux-${{ hashFiles('tools/toolchain.json') }}
      - name: Cache dependency downloads
        uses: actions/cache@v4
        with:
          path: .deps
          key: deps-${{ runner.os }}-release-${{ github.event.repository.name }}-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/ZodiacApplyPatch.cmake', 'cmake/patches/**') }}
      - name: Install and select clang 18 with libc++, lld and the LLVM tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 libc++-18-dev libc++abi-18-dev lld-18 llvm-18
          echo "CC=clang-18" >> "$GITHUB_ENV"
          echo "CXX=clang++-18" >> "$GITHUB_ENV"
      - name: Cache Unicode data
        uses: actions/cache@v4
        with:
          path: .tools/unicode
          key: ucd-16.0.0-${{ hashFiles('tools/gen_unicode.py') }}
      - name: Bootstrap
        run: python bootstrap.py
      - name: Build B (this ref)
        run: |
          .tools/cmake/bin/cmake --preset linux-release
          .tools/cmake/bin/cmake --build --preset linux-release --target bench_types
      - name: Build A (the baseline)
        run: |
          if [ "$BASE" = same ]; then echo "A/A: A is B's own binary, nothing to build."; exit 0; fi
          git worktree add base-src "$BASE"
          ln -s "$PWD/.tools" base-src/.tools
          deps="$PWD/.deps/linux-release"
          root="$PWD"
          (cd base-src && "$root/.tools/cmake/bin/cmake" --preset linux-release -B "$root/build/base" "-DFETCHCONTENT_BASE_DIR=$root/build/base/_deps" "-DFETCHCONTENT_SOURCE_DIR_ANGELSCRIPT_SDK=$deps/angelscript_sdk-src" "-DFETCHCONTENT_SOURCE_DIR_DOCTEST=$deps/doctest-src" "-DFETCHCONTENT_SOURCE_DIR_TOMLPLUSPLUS=$deps/tomlplusplus-src")
          .tools/cmake/bin/cmake --build build/base --target bench_types
      - name: Show the CPU
        run: lscpu | grep -E '^(Model name|CPU\(s\)|Thread|Core|Socket)|MHz|cache'
      - name: A/B
        run: |
          ops=()
          read -r -a names <<< "$OPS"
          for op in "${names[@]}"; do ops+=(--op "$op"); done
          if [ "${#names[@]}" -gt 0 ]; then ops+=(--diagnostic); fi
          a=build/base/tests/bench/bench_types
          if [ "$BASE" = same ]; then a=build/linux-release/tests/bench/bench_types; fi
          if [ "$CALIBRATE" != time ] || [ "$WINDOW_MS" != 1 ] || [ -n "$REPS" ]; then
            ops+=(--bench-arg=--calibrate "--bench-arg=$CALIBRATE" --bench-arg=--window-ms "--bench-arg=$WINDOW_MS")
            if [ -n "$REPS" ]; then ops+=(--bench-arg=--reps "--bench-arg=$REPS"); fi
          fi
          python -I tools/bench_ab.py --a "$a" --b build/linux-release/tests/bench/bench_types --out-dir bench-ab --pairs "$PAIRS" --rounds "$ROUNDS" "${ops[@]}"
      - name: Upload the A/B
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-ab-linux
          path: bench-ab
          if-no-files-found: ignore
