# Placement study (Task 5c, Part C), report-only and never part of the gate (tools/bench_placement.py): on each runner one release bench per
# variant (by default the bench as the gate links it, "aslr", and the same bench linked without ASLR, "fixed", -DZODIAC_BENCH_FIXED_BASE=ON),
# each copied several times, every copy run a few times in its own processes, interleaved. Shows whether an operation's ratio and each side's
# ns follow the copy (the image base Windows draws per file), whether a fixed base removes that, and, with other variants (study-only cache
# options of tests/bench, or label=@<commit> for another commit's bench built in a worktree), how builds compare on the same runner over
# many files. The tables are in each job's log, the runs in the artifact placement-study-<n>. Trigger:
#   gh workflow run placement-study.yml --ref <branch> [-f copies=8 -f runs=2 -f rounds=101 -f ops="..." -f variants="label=-DA=x,-DB=y label2=@<sha> ..."]
name: placement-study

on:
  workflow_dispatch:
    inputs:
      copies:
        description: "copies of each build"
        default: "8"
      runs:
        description: "processes per copy"
        default: "2"
      rounds:
        description: "bench_types --rounds"
        default: "101"
      ops:
        description: "operations, separated by spaces, or all (every gated operation)"
        default: "string_byte_ascii string_length_ascii string_code_ascii string_index_ascii string_find_ascii math_sqrt dict_lookup_10 dict_iterate_10 array_find_string array_insert_last_string"
      variants:
        description: "builds, separated by spaces: label=cmake options separated by commas (on top of every study option reset)"
        default: "aslr= fixed=-DZODIAC_BENCH_FIXED_BASE=ON"
      game:
        description: "seconds of one script game loop per copy (0: none)"
        default: "0"
      windows_jobs:
        description: "the Windows jobs, as a JSON list"
        default: "[1, 2, 3, 4, 5, 6, 7, 8]"
      linux:
        description: "true: also one Linux job with the same variants (commit variants are Windows only)"
        default: "false"
      diagnostic:
        description: "true: run bench_types with --diagnostic, so ops may name its diagnostic-only operations"
        default: "false"

permissions:
  contents: read

env:
  COPIES: ${{ inputs.copies || '8' }}
  RUNS: ${{ inputs.runs || '2' }}
  ROUNDS: ${{ inputs.rounds || '101' }}
  OPS: ${{ inputs.ops }}
  VARIANTS: ${{ inputs.variants || 'aslr= fixed=-DZODIAC_BENCH_FIXED_BASE=ON' }}
  GAME: ${{ inputs.game || '0' }}
  DIAGNOSTIC: ${{ inputs.diagnostic == 'true' && '--bench-arg=--diagnostic' || '' }}

jobs:
  windows:
    if: inputs.windows_jobs != '[]'
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJSON(inputs.windows_jobs || '[1, 2, 3, 4, 5, 6, 7, 8]') }}
    runs-on: windows-latest
    # A release build per variant whose compile flags differ (a full rebuild), a relink per other variant, then the bench processes.
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache toolchain
        uses: actions/cache@v4
        with:
          path: .tools
          key: tools-windows-${{ hashFiles('tools/toolchain.json') }}
      - name: Cache dependency downloads
        uses: actions/cache@v4
        with:
          path: .deps
          key: deps-${{ runner.os }}-release-${{ github.event.repository.name }}-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/ZodiacApplyPatch.cmake', 'cmake/patches/**') }}
      - name: Cache Unicode data
        uses: actions/cache@v4
        with:
          path: .tools/unicode
          key: ucd-16.0.0-${{ hashFiles('tools/gen_unicode.py') }}
      - name: Bootstrap
        run: python bootstrap.py
      - name: Build the variants
        run: |
          read -r -a variants <<< "$VARIANTS"
          deps="$PWD/.deps/windows-release"
          # Fetches the dependency sources first, which a label=@<commit> worktree build reuses.
          .tools/cmake/bin/cmake --preset windows-release > /dev/null
          for variant in "${variants[@]}"; do
            label=${variant%%=*}
            spec=${variant#*=}
            mkdir -p "builds/$label"
            if [ "${spec:0:1}" = "@" ]; then
              # label=@<full commit SHA>: that commit's bench, built in a worktree from the dependency sources this job fetched.
              ref=${spec:1}
              echo "== $label: commit $ref"
              git fetch -q origin "$ref" || true
              git worktree add "src-$label" "$ref"
              powershell -NoProfile -Command "New-Item -ItemType Junction -Path 'src-$label/.tools' -Target (Resolve-Path .tools) | Out-Null"
              (cd "src-$label" && ../.tools/cmake/bin/cmake --preset windows-release -B "../build/$label" "-DFETCHCONTENT_BASE_DIR=$PWD/../build/$label/_deps" "-DFETCHCONTENT_SOURCE_DIR_ANGELSCRIPT_SDK=$deps/angelscript_sdk-src" "-DFETCHCONTENT_SOURCE_DIR_DOCTEST=$deps/doctest-src" "-DFETCHCONTENT_SOURCE_DIR_TOMLPLUSPLUS=$deps/tomlplusplus-src" > /dev/null)
              .tools/cmake/bin/cmake --build "build/$label" --target bench_types
              cp "build/$label/tests/bench/bench_types.exe" "build/$label/tests/bench/bench_types.exe.map" "builds/$label/"
            else
              # Every study option back to its default first (the release code alignment's is blocks), then this variant's (commas between
              # options; -DZODIAC_RELEASE_CODE_ALIGN= for none).
              options=(-DZODIAC_BENCH_FIXED_BASE=OFF -DZODIAC_BENCH_ALLOCATOR= -DZODIAC_BENCH_STRING_CACHE_TOP= -DZODIAC_RELEASE_CODE_ALIGN=blocks -DZODIAC_BENCH_PAD=0 -DZODIAC_BENCH_CORE_PAD=0)
              IFS=, read -r -a extra <<< "$spec"
              options+=("${extra[@]}")
              echo "== $label: ${options[*]}"
              .tools/cmake/bin/cmake --preset windows-release "${options[@]}" > /dev/null
              .tools/cmake/bin/cmake --build --preset windows-release --target bench_types
              cp build/windows-release/tests/bench/bench_types.exe build/windows-release/tests/bench/bench_types.exe.map "builds/$label/"
            fi
            .tools/llvm-mingw/bin/llvm-readobj --file-headers "builds/$label/bench_types.exe" | grep -iE "ImageBase|DYNAMIC_BASE" || true
          done
      - name: Show the CPU
        shell: pwsh
        run: Get-CimInstance Win32_Processor | Select-Object Name,NumberOfCores,NumberOfLogicalProcessors,MaxClockSpeed | Format-List
      - name: Study
        run: |
          args=(--copies "$COPIES" --runs "$RUNS" --rounds "$ROUNDS")
          read -r -a variants <<< "$VARIANTS"
          for variant in "${variants[@]}"; do label=${variant%%=*}; args+=(--variant "$label=builds/$label/bench_types.exe"); done
          if [ -z "$OPS" ] || [ "$OPS" = all ]; then mapfile -t names < <("builds/${variants[0]%%=*}/bench_types.exe" --list | tr -d '\r'); else read -r -a names <<< "$OPS"; fi
          for op in "${names[@]}"; do args+=(--op "$op"); done
          python -I tools/bench_placement.py "${args[@]}" --game "$GAME" --bench-arg=--calibrate --bench-arg=time $DIAGNOSTIC --out-dir placement
      - name: Upload the runs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: placement-study-${{ matrix.job }}
          path: |
            placement/*.json
            placement/*.txt
            placement/runs.jsonl
          if-no-files-found: ignore
      # The builds themselves (each variant's bench_types.exe and its map), from the first job only, for reading their code offline.
      - name: Upload the builds
        if: always() && matrix.job == 1
        uses: actions/upload-artifact@v4
        with:
          name: placement-study-builds
          path: builds/
          if-no-files-found: ignore

  linux:
    if: inputs.linux == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache toolchain
        uses: actions/cache@v4
        with:
          path: .tools
          key: tools-linux-${{ hashFiles('tools/toolchain.json') }}
      - name: Cache dependency downloads
        uses: actions/cache@v4
        with:
          path: .deps
          key: deps-${{ runner.os }}-release-${{ github.event.repository.name }}-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/ZodiacApplyPatch.cmake', 'cmake/patches/**') }}
      - name: Install and select clang 18 with libc++, lld and the LLVM tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 libc++-18-dev libc++abi-18-dev lld-18 llvm-18
          echo "CC=clang-18" >> "$GITHUB_ENV"
          echo "CXX=clang++-18" >> "$GITHUB_ENV"
      - name: Cache Unicode data
        uses: actions/cache@v4
        with:
          path: .tools/unicode
          key: ucd-16.0.0-${{ hashFiles('tools/gen_unicode.py') }}
      - name: Bootstrap
        run: python bootstrap.py
      - name: Build the variants
        run: |
          read -r -a variants <<< "$VARIANTS"
          for variant in "${variants[@]}"; do
            label=${variant%%=*}
            spec=${variant#*=}
            if [ "${spec:0:1}" = "@" ]; then echo "== $label: a commit variant, Windows only"; continue; fi
            options=(-DZODIAC_BENCH_STRING_CACHE_TOP= -DZODIAC_RELEASE_CODE_ALIGN=blocks -DZODIAC_BENCH_PAD=0 -DZODIAC_BENCH_CORE_PAD=0)
            IFS=, read -r -a extra <<< "$spec"
            options+=("${extra[@]}")
            echo "== $label: ${options[*]}"
            .tools/cmake/bin/cmake --preset linux-release "${options[@]}" > /dev/null
            .tools/cmake/bin/cmake --build --preset linux-release --target bench_types
            mkdir -p "builds/$label"
            cp build/linux-release/tests/bench/bench_types build/linux-release/tests/bench/bench_types.map "builds/$label/"
          done
      - name: Show the CPU
        run: lscpu | grep -E '^(Model name|CPU\(s\)|Thread|Core|Socket)|MHz|cache'
      - name: Study
        run: |
          args=(--copies "$COPIES" --runs "$RUNS" --rounds "$ROUNDS")
          read -r -a variants <<< "$VARIANTS"
          first=""
          for variant in "${variants[@]}"; do
            label=${variant%%=*}
            spec=${variant#*=}
            if [ "${spec:0:1}" = "@" ]; then continue; fi
            [ -n "$first" ] || first=$label
            args+=(--variant "$label=builds/$label/bench_types")
          done
          if [ -z "$OPS" ] || [ "$OPS" = all ]; then mapfile -t names < <("builds/$first/bench_types" --list); else read -r -a names <<< "$OPS"; fi
          for op in "${names[@]}"; do args+=(--op "$op"); done
          python -I tools/bench_placement.py "${args[@]}" --game "$GAME" --bench-arg=--calibrate --bench-arg=time $DIAGNOSTIC --out-dir placement
      - name: Upload the runs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: placement-study-linux
          path: |
            placement/*.json
            placement/*.txt
            placement/runs.jsonl
          if-no-files-found: ignore
